name: Metrics

# Snapshots this repo's traffic metrics daily into the orphan `metrics-data`
# branch. Purpose: GitHub's Insights -> Traffic panel discards views, clones,
# referrers, and popular paths after 14 days, and no API can reconstruct them.
# Every day this does not run is a day of history destroyed permanently.
#
# It used to call deploy-pages.yml afterwards to republish the dashboard from
# what it just wrote. That deploy is gone in this fork: GitHub Pages is not
# enabled here, so it only ever produced a red run, and the version bump touches
# scripts/metrics/package.json, which matches the removed workflow's paths
# filter and fired it on every release. Collection and the push to `metrics-data`
# are unaffected; only the publish half is missing.
#
# Why two tokens: the traffic endpoints require the "Administration: read"
# permission, and there is no `administration` key in the Actions `permissions:`
# vocabulary at all — so GITHUB_TOKEN cannot reach them under any configuration.
# An installation token of the backspace-release-bot GitHub App reads: the app
# is installed on this repository only and holds Administration: read, and the
# "Mint the traffic token" step creates a read-only token from it on every run,
# which the action revokes when the job ends. GITHUB_TOKEN writes. Neither alone
# can both read traffic and modify the archive. The app token replaced a
# fine-grained PAT stored as the METRICS_TOKEN secret, which had an expiry date
# and had to be renewed by hand; the app's private key has none. The collector
# still reads its token from the METRICS_TOKEN environment variable, which is
# how a developer running it by hand passes a PAT.
#
# Never runs on a fork: the release bot's secrets do not propagate to forks,
# so a fork's token step would fail every single day with nothing anyone could
# do about it short of disabling the workflow. `github.event.repository.fork`
# gates the job instead of a hardcoded repo slug, which stays correct if the
# project is ever renamed or transferred.
#
# Why `gh workflow enable`: GitHub disables scheduled workflows after 60 days
# with no repository activity. This workflow's own commits go to a non-default
# branch and are made with GITHUB_TOKEN, so they cannot be relied on to reset
# that timer. Re-enabling on every run is idempotent and costs one API call.
# It needs `actions: write` — without that scope the call fails silently
# (masked by `|| true` so a stalled collector doesn't also fail the run over
# a self-heal step), which would defeat the entire point of running it.
#
# See docs/systems/metrics.md.

on:
  schedule:
    # 15:19 UTC daily. The hour is chosen, not arbitrary, and it sits between
    # two edges.
    #
    # The lower edge is GitHub's traffic aggregation. A day's views and clones
    # appear some hours into the next day, and the boundary moves. Measured
    # here: the 07:25 UTC run on 2026-09-02 picked up 2026-09-01, but the
    # 07:28 UTC run on 2026-09-03 found no 2026-09-02 bucket at all, and that
    # bucket was present by 12:57 UTC the same day. A run sitting on that
    # boundary collects yesterday's traffic on some days and not others.
    #
    # Losing that race costs freshness, not data. The traffic API returns a
    # 14-day window and the merge overwrites, so the next run fills the gap
    # (docs/systems/metrics.md, section 4.4). What it does cost is a dashboard
    # where views and clones publish one to two days behind while stars, forks
    # and downloads, read from live counters, are same-day.
    #
    # The upper edge is midnight UTC. Scheduled runs are queued, not punctual:
    # `0 3` was dispatching at 07:25 and 07:28, about 4.4 hours late, because
    # the top of the hour is the most contended slot GitHub has. A run pushed
    # past 00:00 UTC stamps its rows with the wrong `today`, and stars.csv,
    # forks.csv and repo.csv only ever write today's row, so a date they skip
    # is never revisited (section 4.1). 15:19 leaves hours of margin on both
    # sides, and the odd minute keeps it off the contended slots.
    - cron: '19 15 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Never cancel in progress: metrics.yml and backfill.yml write the same files,
# and cancelling a collection run loses that day irrecoverably. Sharing the
# `metrics-data` group also means the two workflows queue instead of racing
# each other's pushes.
concurrency:
  group: metrics-data
  cancel-in-progress: false

jobs:
  collect:
    name: Collect metrics
    # Skip entirely on forks. A fork's Actions run still resolves
    # `github.repository` to its own slug, but it never has the release bot's
    # RELEASE_BOT_APP_ID and RELEASE_BOT_PRIVATE_KEY (secrets do not propagate
    # to forks), so the token step would otherwise fail loudly on a schedule
    # the fork owner never opted into.
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    # Both scopes are load-bearing, and Scorecard's Token-Permissions check
    # reports a job-level `contents` or `actions` write whatever the reason
    # for it. Do not remove either to clear that finding.
    permissions:
      # Pushes the day's rows to the metrics-data branch. Without it the
      # collection is thrown away, and the traffic endpoints only expose a
      # trailing 14-day window, so a lost day cannot be fetched again later.
      contents: write
      # Required by the "Keep the schedule alive" step, which calls
      # `gh workflow enable` (PUT /actions/workflows/{id}/enable). GitHub
      # disables a scheduled workflow after 60 days without repository
      # activity and that endpoint is what resets it. The same scope also
      # covers the `actions: read` that METRICS_ACTIONS_TOKEN uses to read
      # /actions/runs for workflows.csv.
      actions: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The data branch must be created BEFORE actions/checkout is asked for it:
      # checkout with a nonexistent ref hard-fails the job, so a bootstrap step
      # placed after it could never run.
      #
      # Built as a `git worktree add --orphan` into a scratch directory rather
      # than `git switch --orphan` in place. Both start genuinely empty —
      # `git switch --orphan` removes all tracked files, and only the legacy
      # `git checkout --orphan` carries the previous tree over into the index.
      # The worktree is preferred because it never touches the primary
      # checkout at all: the later "Collect" step runs the collector from the
      # repository root and needs that tree intact, and a scratch worktree
      # removes any way for this step to leave it modified on an early exit.
      - name: Bootstrap the data branch if absent
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin metrics-data >/dev/null 2>&1; then
            echo "metrics-data exists"
          else
            echo "Creating orphan branch metrics-data"
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git worktree add --orphan -b metrics-data .metrics-init
            git -C .metrics-init commit --allow-empty -m "chore(metrics): initialise data branch"
            git -C .metrics-init push origin metrics-data
            git worktree remove .metrics-init --force
          fi

      - name: Checkout the data branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: metrics-data
          path: .metrics-data

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Pinned to 24: the collector is TypeScript executed directly by Node's
          # native type stripping, with no build step and no dependencies.
          node-version: 24
          # This job never installs anything, so there is no dependency cache to
          # prime. Left at its default, setup-node detects the repo's pnpm from
          # the root package.json and fails the step trying to invoke it, because
          # nothing here installs pnpm the way ci.yml does.
          package-manager-cache: false

      # Mints the token the "Collect" step reads with. The traffic endpoints
      # need Administration: read, which GITHUB_TOKEN cannot carry (see the
      # header), so this is an installation token of the backspace-release-bot
      # GitHub App, installed on this repository only. A new one is minted on
      # every run, it lives at most an hour, and the action revokes it when the
      # job ends, so there is no long-lived credential to renew. Placed
      # directly before its only consumer so no earlier step can see it.
      #
      # `repositories` names this repository explicitly. With neither `owner`
      # nor `repositories` set the action already scopes the token to
      # GITHUB_REPOSITORY, but the input keeps the scope readable here.
      # `github.repository` (`owner/name`, which the action accepts) rather
      # than `github.event.repository.name`, because it is set on every event
      # this workflow runs on, `schedule` included.
      #
      # The permissions are exactly what the collector sends this token to
      # (`collect()` in scripts/metrics/src/collect.ts), each justified by
      # GitHub's "Permissions required for GitHub Apps" table:
      #   administration: read   GET /repos/{owner}/{repo}/traffic/views,
      #                          /traffic/clones, /traffic/popular/referrers
      #                          and /traffic/popular/paths
      #   contents: read         GET /repos/{owner}/{repo}/releases (paginated,
      #                          for releases.csv and the download counters)
      #   metadata: read         GET /repos/{owner}/{repo} (stars, forks,
      #                          subscribers, open issues) and
      #                          GET /repos/{owner}/{repo}/stats/contributors.
      #                          GitHub adds it to every installation token
      #                          anyway; it is listed so the set is complete.
      # Nothing more. `/actions/runs` goes through METRICS_ACTIONS_TOKEN (this
      # job's GITHUB_TOKEN, below) and the telemetry export has its own token.
      # Every scope requested here must also be granted to the installation,
      # or minting fails and the run records a failure before collecting.
      #
      # RELEASE_BOT_APP_ID holds the app's numeric App ID. The action passes
      # `client-id` straight through as the JWT issuer, which GitHub accepts
      # as either the client ID or the App ID.
      - name: Mint the traffic token
        id: traffic-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          repositories: ${{ github.repository }}
          permission-administration: read
          permission-contents: read
          permission-metadata: read

      - name: Collect
        env:
          # The collector's variable name predates the app token and is kept:
          # it is also how a developer running the collector by hand passes a
          # PAT (docs/systems/metrics.md, section 9).
          METRICS_TOKEN: ${{ steps.traffic-token.outputs.token }}
          # `/actions/runs` (workflows.csv) only. It needs `actions: read`,
          # which this job already holds via the `actions: write` that the
          # schedule keep-alive step below requires. Unlike the traffic
          # endpoints' `administration` requirement, `actions` exists in the
          # Actions permissions vocabulary, so the built-in token reaches it.
          # Keeping the scope here rather than on the app token leaves that
          # token no wider than the endpoints that force it.
          METRICS_ACTIONS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional. Unset until the receiver is live; the step logs a skip.
          TELEMETRY_EXPORT_TOKEN: ${{ secrets.TELEMETRY_EXPORT_TOKEN }}
          # Optional repository VARIABLE, not a secret: it is a hostname, it is
          # already in the docs, and a secret here would be a secret nobody
          # could read back to check. Unset, `vars` interpolates the empty
          # string and the collector falls back to the default receiver.
          TELEMETRY_ENDPOINT: ${{ vars.TELEMETRY_ENDPOINT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          METRICS_DATA_DIR: ${{ github.workspace }}/.metrics-data
        run: node scripts/metrics/src/cli-collect.ts

      - name: Commit and push
        working-directory: .metrics-data
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No change to commit"
            exit 0
          fi
          git commit -m "chore(metrics): snapshot $(date -u +%Y-%m-%d)"
          # backfill.yml can be dispatched while this runs. Rebase and retry
          # rather than clobbering, then fail loudly if it still will not land.
          for attempt in 1 2 3; do
            if git push origin metrics-data; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt), rebasing"
            git pull --rebase origin metrics-data
          done
          echo "Could not push after 3 attempts"
          exit 1

      # Runs only when something upstream in this job failed (a required
      # fetch in "Collect", or the "Commit and push" step itself) — never on
      # success. On success there is nothing left to record: `collect()`
      # already wrote a complete, correct meta.json as the last step of its
      # own atomic write phase (see collect.ts), and the "Commit and push"
      # step above already commits it alongside the data files via
      # `git add -A`. A second write here on the success path would just be
      # a redundant, confusing second daily commit — which is exactly what
      # this replaces. See docs/systems/metrics.md §3.3.
      - name: Record failure
        if: failure()
        env:
          METRICS_DATA_DIR: ${{ github.workspace }}/.metrics-data
          # Interpolated here in `env:`, never into the `run:` string below.
          # Carries the run URL because this string is the whole of what a
          # maintainer reading meta.json gets: a bare "failure" tells them the
          # archive stopped but not where to look.
          METRICS_RUN_OUTCOME: >-
            run ${{ job.status }} —
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/metrics/src/cli-record-failure.ts

      # Split from "Record failure" above rather than folded into one step:
      # the CLI only ever touches the working tree (via `store.ts`), and
      # every other step in this job that runs `git` does so as its own
      # step with its own identity/add/commit/push, for the same reason
      # "Commit and push" above is separate from "Collect" — a step that
      # fails partway through this shell script (e.g. the push) should not
      # be indistinguishable in the logs from the write itself failing.
      - name: Commit and push failure record
        if: failure()
        working-directory: .metrics-data
        run: |
          set -euo pipefail
          # Own identity for the same reason "Commit and push" above needs
          # one: this step can run on a path where no prior step in this job
          # configured git, and a `git commit` under an auto-detected
          # `runner@<vm>` identity would be inconsistent with every other
          # commit on this branch — on exactly the runs this step exists to
          # make visible.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meta.json
          git diff --cached --quiet || {
            git commit -m "chore(metrics): record run failure"
            # This commit carries only run metadata; the data commit (when
            # it happens) has its own retry loop and hard-fails on its own.
            # Swallow a push failure here so a metadata push cannot mask or
            # compound an already-failed run, but surface it — an
            # unannotated `|| true` is how a real problem stays invisible
            # for months.
            git push origin metrics-data \
              || echo "::warning::failed to push failure record to metrics-data"
          }

      - name: Keep the schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: gh workflow enable metrics.yml --repo "$REPO" || true

  # The `deploy-dashboard` job that stood here called the local reusable
  # deploy-pages.yml, and is gone with it: this fork does not publish GitHub
  # Pages, so every call failed at actions/configure-pages and turned the
  # collection run red over a deploy that could never have happened. The
  # collection above is untouched.
